[package]
name = "ruko"
version = "1.0.0"
edition = "2021"
description = "Ruko game server (Rust port of server.js + boot.js + routes.js)"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
scrypt = "0.11"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
chrono = "0.4"
unicode-normalization = "0.1"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
